    if(j&&j[0]){const lat=+j[0].lat,lng=+j[0].lon;if(inOkinawaMain(lat,lng))return {lat,lng}}}catch(e){console.warn("geocode",e)}
  return null;
}
/* ---------- 場所をきめる（検索・貼りつけ・地図タップ） ---------- */
const PK={i:-1,pick:null,name:"",view:null,touch:true};
function parseLatLng(s){s=String(s||"").trim();if(!s)return null;
  if(/goo\.gl|maps\.app/i.test(s)&&!/@-?\d/.test(s))return {err:"短いリンクには座標が入っていません。Googleマップで場所を長押しして、上に出る数字（26.xxxx, 127.xxxx）をコピーして貼ってね"};
  const m=s.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/)||s.match(/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/)||s.match(/[?&](?:q|ll|query|center|destination|daddr|saddr)=(-?\d{1,2}\.\d+)(?:,|%2C)(-?\d{1,3}\.\d+)/i)||s.match(/^(-?\d{1,2}\.\d+)\s*[,、\s]\s*(-?\d{1,3}\.\d+)$/);
  if(!m)return {err:"座標が見つかりませんでした。「26.5047, 127.8503」の形か、座標入りのGoogleマップのリンクを貼ってね"};
  const lat=+m[1],lng=+m[2];if(lat<24||lat>27.5||lng<122||lng>129)return {err:"沖縄の外の座標みたい。もう一度確認してね"};return {lat,lng};
}
async function searchPlaces(q){
  const u="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=ja&countrycodes=jp&viewbox=126.6,27.2,128.6,25.9&bounded=1&q="+encodeURIComponent(q);
  const r=await fetch(u,{signal:AbortSignal.timeout?AbortSignal.timeout(10000):undefined});if(!r.ok)throw new Error("search "+r.status);const j=await r.json();
  return (j||[]).map(x=>{const name=x.name||String(x.display_name||"").split(",")[0];const addr=String(x.display_name||"").split(",").map(s=>s.trim()).filter(s=>s&&s!==name&&!/^\d{3}-?\d{4}$/.test(s)&&s!=="日本").slice(0,4).reverse().join(" ");return {name,addr,lat:+x.lat,lng:+x.lon}});
}
function openPicker(i){
  const s=S.editing?.stops?.[i];if(!s)return;const c=coordOf(s);
  PK.i=i;PK.pick=c?{lat:c.lat,lng:c.lng}:null;PK.name="";PK.view=c?clampView([MX(c.lng)-60,MY(c.lat)-75,120,151]):null;PK.q=s.q||s.n||"";
  $("#layer2").innerHTML=`<div class="modal top"><div class="box picker">
    <div class="ed-head"><h2>場所をきめる</h2><button class="x" id="pk-close" aria-label="とじる">×</button></div>
    <div class="small muted" style="margin:-4px 0 8px">「${esc(s.n||"この予定")}」の場所を地図に置きます。</div>
    <form class="pk-search" id="pk-form"><input id="pk-q" value="${esc(PK.q)}" placeholder="名前で検索（例：万座毛、瀬長島ウミカジテラス）" maxlength="80"><button class="btn mini sea" type="submit" id="pk-go">さがす</button></form>
    <div id="pk-results" class="pk-results"></div>
    <details class="pk-paste"><summary>Googleマップの座標やリンクを貼る</summary><div class="pk-paste-in"><input id="pk-paste" placeholder="26.5047, 127.8503（またはリンク）"><button class="btn mini" type="button" id="pk-paste-go">置く</button></div>
      <div class="small muted">Googleマップで場所を長押し → 画面の上に出る数字（26.xxxx, 127.xxxx）をコピーして貼るのが確実です。</div></details>
    <div class="small" style="margin:8px 0 4px">地図をタップしてもピンを置けます（2本指で広げる・動かす）</div>
    <div class="map pk-map" id="pk-map"></div>
    <div class="pk-foot"><span id="pk-state" class="small"></span><div class="pk-btns">${c?`<button class="btn mini ghost" type="button" id="pk-clear">場所をなくす</button>`:""}<button class="btn sea" type="button" id="pk-ok">この場所にする</button></div></div>
  </div></div>`;
  drawPick();
  $("#pk-close").onclick=()=>{$("#layer2").innerHTML=""};
  $("#pk-form").onsubmit=async e=>{e.preventDefault();const q=$("#pk-q").value.trim();if(!q||PK.searching)return;const box=$("#pk-results");box.innerHTML=`<div class="small muted">さがしています…</div>`;PK.searching=true;const go=$("#pk-go");if(go)go.disabled=true;
    try{const rs=await searchPlaces(q);if(!rs.length){box.innerHTML=`<div class="small muted">見つかりませんでした。別の言い方（例：「〇〇 恩納村」）にするか、地図をタップして置いてね</div>`;return}
      box.innerHTML=rs.map((r,j)=>`<button type="button" class="pk-hit" data-hit="${j}"><b>${esc(r.name)}</b><small>${esc(r.addr)}</small></button>`).join("")+`<div class="small muted" style="font-size:10.5px">検索結果：© OpenStreetMap contributors</div>`;
      box.querySelectorAll("[data-hit]").forEach(b=>b.onclick=()=>{const r=rs[+b.dataset.hit];PK.pick={lat:r.lat,lng:r.lng};PK.name=r.name;PK.view=clampView([MX(r.lng)-60,MY(r.lat)-75,120,151]);box.querySelectorAll(".pk-hit").forEach(x=>x.classList.toggle("on",x===b));beep("tap");drawPick()})}
    catch(err){console.warn(err);box.innerHTML=`<div class="small muted">検索できませんでした（電波かOpenStreetMapの混雑）。地図をタップして置くか、座標を貼ってね</div>`}
    finally{PK.searching=false;const g=$("#pk-go");if(g)g.disabled=false}};
  $("#pk-paste").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("#pk-paste-go").click()}};
  $("#pk-paste-go").onclick=()=>{const r=parseLatLng($("#pk-paste").value);if(!r){toast("座標かリンクを貼ってね");return}if(r.err){toast(r.err);return}PK.pick=r;PK.view=clampView([MX(r.lng)-60,MY(r.lat)-75,120,151]);beep("tap");drawPick()};
  $("#pk-clear")?.addEventListener("click",()=>{const st=S.editing.stops[PK.i];delete st.lat;delete st.lng;delete st.pinned;if(COORDS[st.id])st.noDefault=true;$("#layer2").innerHTML="";drawEditor();toast("地図の位置をなくしました")});
  $("#pk-ok").onclick=()=>{if(!PK.pick){toast("まず地図に場所を置いてね");return}const st=S.editing.stops[PK.i];st.lat=+PK.pick.lat.toFixed(5);st.lng=+PK.pick.lng.toFixed(5);st.pinned=true;delete st.noDefault;if(!st.q&&PK.name)st.q=PK.name;
    $("#layer2").innerHTML="";drawEditor();beep("clear");toast("地図に置きました。「保存する」で確定します")};
}
const PICK_CTL={touch:()=>true,commit:vb=>{PK.view=vb;drawPick()},reset:()=>{PK.view=PK.pick?clampView([MX(PK.pick.lng)-60,MY(PK.pick.lat)-75,120,151]):null;drawPick()},
  tap:(e,el)=>{const m=document.querySelector("#pk-map");if(!m)return false;if(el?.closest?.(".inset")){PK.view=MAP_FULL;beep("tap");drawPick();return true}const [sx,sy]=m.toSvg(e.clientX,e.clientY);PK.pick={lat:ILAT(sy),lng:ILNG(sx)};PK.name="";beep("tap");drawPick();return true}};
function drawPick(){const m=$("#pk-map");if(!m)return;const day=S.editing?.n||S.planDay;
  m.innerHTML=mapSVG(day,{view:PK.view||dayBox(day,true),pick:PK.pick})+mapCtrlHTMLFor(PICK_CTL);initMapGestures(m,PICK_CTL);
  const st=$("#pk-state");if(st)st.innerHTML=PK.pick?`ピンの位置：${PK.pick.lat.toFixed(4)}, ${PK.pick.lng.toFixed(4)}${PK.name?`（${esc(PK.name)}）`:""}`:`まだ置いていません`;
  const ok=$("#pk-ok");if(ok)ok.disabled=!PK.pick;
}
function openEditor(n){
  const d=JSON.parse(JSON.stringify(DAYS()[n-1]));S.editing=d;S.editingOrig=JSON.stringify(d);S.saving=false;drawEditor();
}
function closeEditor(){if($(".editor")){try{collectEditor()}catch(e){console.warn(e)}}if(editorDirty()&&!S.edCloseArm){S.edCloseArm=true;toast("保存していない変更があります。消してよければ、もう一度×を押してね");setTimeout(()=>{S.edCloseArm=false},4000);return}S.edCloseArm=false;S.editing=null;drawEditor()}
function editorDirty(){return !!S.editing&&JSON.stringify(S.editing)!==S.editingOrig}
function drawEditor(){
  const d=S.editing;if(!d){$("#layer").innerHTML="";return}
  const sc=$(".editor")?.scrollTop||0;
  const f=(k,label,ph="")=>`<label class="fld"><span>${label}</span><input data-k="${k}" value="${esc(d[k]||"")}" placeholder="${esc(ph)}" maxlength="120"></label>`;
  $("#layer").innerHTML=`<div class="modal"><div class="box editor" style="--c:${DC(d.n)}">
    <div class="ed-head"><h2>DAY${d.n} の予定を編集</h2><button class="x" id="ed-close" aria-label="とじる">×</button></div>
    <div class="ed-grid">${f("date","日付","11/19")}${f("dow","曜日","木")}${f("title","タイトル","那覇に到着！")}${f("theme","テーマ","はじまりの島")}${d.n===1||d.n===6?f("flight",d.n===1?"行きの飛行機":"帰りの飛行機","便名・時間"):""}${f("stay","泊まるエリア","那覇")}${f("hotel","ホテル名","")}</div>
    <label class="fld"><span>メモ（Miiが吹き出しで教えてくれます）</span><textarea data-k="note" maxlength="300">${esc(d.note||"")}</textarea></label>
    <div class="ed-stops">${(d.stops||[]).map((s,i)=>`<div class="ed-stop" data-i="${i}">
      <div class="ed-stop-row"><input class="t" data-s="t" value="${esc(s.t)}" placeholder="10:00" maxlength="8"><input class="n" data-s="n" value="${esc(s.n)}" placeholder="行き先・やること" maxlength="60"><div class="ed-btns"><button data-mv="-1" aria-label="上へ">▲</button><button data-mv="1" aria-label="下へ">▼</button><button data-del aria-label="削除">×</button></div></div>
      <input class="d" data-s="d" value="${esc(s.d||"")}" placeholder="ひとことメモ" maxlength="80">
      <div class="ed-stop-row2"><input class="q" data-s="q" value="${esc(s.q||"")}" placeholder="場所の名前（検索用。例：万座毛）" maxlength="60"><label class="chk"><input type="checkbox" data-s="stamp" ${s.stamp?"checked":""}>スタンプの場所にする</label></div>
      <div class="ed-place">${coordOf(s)?`<span class="pl ok">地図にピンあり</span>`:`<span class="pl">${s.stamp?"スタンプの場所なのに、地図の位置がまだです":"地図の位置が未設定（地図には出ません）"}</span>`}<button type="button" class="btn mini ${coordOf(s)?"ghost":"sea"}" data-place>${coordOf(s)?"場所を変える":"場所をきめる"}</button></div></div>`).join("")}
    </div>
    <button class="btn ghost" id="ed-add">＋ 予定を追加</button>
    <div class="ed-foot"><span class="small muted">ミッションガチャとスタンプラリーは、ここに書いた行き先に合わせて自動で変わります。</span><button class="btn sea" id="ed-save">保存する</button></div>
  </div></div>`;
  const box=$(".editor");if(box&&sc)box.scrollTop=sc;
}
function collectEditor(){
  const d=S.editing,box=$(".editor");box.querySelectorAll("input[data-k],textarea[data-k]").forEach(i=>d[i.dataset.k]=i.value.trim());
  d.stops=[...box.querySelectorAll(".ed-stop")].map((el,i)=>{const o=d.stops[i]||{id:"x"+uid()};el.querySelectorAll("[data-s]").forEach(inp=>{const v=inp.type==="checkbox"?inp.checked:inp.value.trim();
    if(inp.dataset.s==="q"&&v!==(o.q||"")&&!o.pinned){delete o.lat;delete o.lng;if(COORDS[o.id]){if(v!==(DEFAULT_Q[o.id]||""))o.noDefault=true;else delete o.noDefault}}o[inp.dataset.s]=v});return o});
}
$("#layer").addEventListener("click",async e=>{
  if(!S.editing||!e.target.closest(".editor")||S.saving)return;const t=e.target.closest("button");if(!t)return;
  if(t.id==="ed-close"){closeEditor();return}
  collectEditor();
  if(t.id==="ed-add"){S.editing.stops.push({id:"x"+uid(),t:"",n:"",d:"",q:"",stamp:false});drawEditor();$(".ed-stop:last-child .n")?.focus();return}
  const row=t.closest(".ed-stop");
  if(row&&t.dataset.mv){const i=+row.dataset.i,j=i+(+t.dataset.mv);if(j<0||j>=S.editing.stops.length)return;[S.editing.stops[i],S.editing.stops[j]]=[S.editing.stops[j],S.editing.stops[i]];drawEditor();return}
  if(row&&t.hasAttribute("data-del")){S.editing.stops.splice(+row.dataset.i,1);drawEditor();return}
  if(row&&t.hasAttribute("data-place")){openPicker(+row.dataset.i);return}
  if(t.id==="ed-save"){
    const d=S.editing;d.stops=d.stops.filter(s=>s.n);d.stops.forEach(s=>{if(!s.id)s.id="x"+uid()});drawEditor();
    S.saving=true;const box=$(".editor");box.querySelectorAll("input,textarea,button").forEach(x=>x.disabled=true);const sv=$("#ed-save");
    try{
      const need=d.stops.filter(s=>s.q&&!coordOf(s));
      for(const s of need){if(sv)sv.textContent="地図の場所をしらべています…";const c=await geocode(s.q);if(c){s.lat=c.lat;s.lng=c.lng}await new Promise(r=>setTimeout(r,1100))}
      if(sv)sv.textContent="保存しています…";
      const days=JSON.parse(JSON.stringify(DAYS()));days[d.n-1]=d;
      await S.db.doc("trip/plan").set({days,updatedAt:Date.now(),by:S.who});S.saving=false;S.editing=null;drawEditor();toast("保存しました");beep("clear")}
    catch(err){S.saving=false;writeErr(err);if(S.editing)drawEditor()}
  }
});

/* ---------- スタンプ ---------- */
function spotPhotos(id){const r={};for(const p of S.photos)if(p.spot===id&&!r[p.who])r[p.who]=p;return r}
function stampSVG(name,isNew){return `<svg class="stampmark ${isNew?"new":""}" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="var(--shu)"><circle cx="50" cy="50" r="46" stroke-width="4"/><circle cx="50" cy="50" r="38" stroke-width="1.5"/></g><text x="50" y="44" text-anchor="middle" font-family="Mochiy Pop One, sans-serif" font-size="15" fill="var(--shu)">とうちゃく</text><path d="M28 54h44" stroke="var(--shu)" stroke-width="1.5"/><text x="50" y="70" text-anchor="middle" font-family="DotGothic16, monospace" font-size="10" fill="var(--shu)">${esc(name.length>7?name.slice(0,7):name)}</text></svg>`}
function stampedIds(){return SPOTS().filter(s=>{const p=spotPhotos(s.id);return p.sai&&p.yui}).map(s=>s.id)}
function renderStamp(){
  const spots=SPOTS(),done=stampedIds(),seen=new Set((ls.get("seenStamps")||"").split(",").filter(Boolean));
  const all=spots.length>0&&done.length===spots.length;
  const chest=all?`<svg viewBox="0 0 64 56"><path d="M6 24 h52 v28 h-52z" fill="#c98a4b" stroke="#23314f" stroke-width="3"/><path d="M6 24 L12 4 h40 l6 20" fill="#e3a35c" stroke="#23314f" stroke-width="3" stroke-linejoin="round" transform="rotate(-18 6 24)"/><path d="M14 22 l4 -10 M30 20 l2 -12 M46 22 l-2 -10" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/><rect x="28" y="30" width="8" height="10" fill="#ffd23f" stroke="#23314f" stroke-width="2"/></svg>`
    :`<svg viewBox="0 0 64 56"><path d="M6 24 h52 v28 h-52z" fill="#c98a4b" stroke="#23314f" stroke-width="3"/><path d="M6 24 q0 -18 26 -18 q26 0 26 18z" fill="#e3a35c" stroke="#23314f" stroke-width="3"/><path d="M6 30 h52" stroke="#23314f" stroke-width="3"/><rect x="27" y="24" width="10" height="13" rx="2" fill="#ffd23f" stroke="#23314f" stroke-width="2"/><circle cx="32" cy="30" r="2" fill="#23314f"/></svg>`;
  $("#v-stamp").innerHTML=`
  ${HEAD("ふたりのスタンプラリー","#f5a524")}
  <div class="prog-row"><div class="bar"><i style="width:${spots.length?done.length/spots.length*100:0}%"></i></div><span class="num">${done.length}/${spots.length}</span></div>
  ${SAY(S.who==="yui"?"sai":"yui","着いたら、ふたりがそれぞれ写真をあげてね。そろったらスタンプがポン！")}
  <div class="spots">${spots.map(s=>{const p=spotPhotos(s.id),ok=p.sai&&p.yui;
    const slot=w=>{const ph=p[w],busy=S.busy?.["spot:"+s.id]&&w===S.who,mine=w===S.who&&!ph&&S.canWrite&&S.assets&&!busy;
      return `<button class="slot ${mine?"mine":""}" ${mine?`data-up="${s.id}"`:ph?`data-open="${ph.id}"`:"disabled"}><span class="who">${NAME[w]}</span>${ph?`<img class="ph" src="${blob(ph.thumb||ph.full)}" alt="${NAME[w]}の写真" loading="lazy">`:busy?`<span>送信中…</span>`:mine?`<span><span class="plus">＋</span><br>写真をあげて<br>とうちゃく！</span>`:`<img class="face" src="${MII[w]}" alt="">`}</button>`};
    return `<div class="spot" style="--c:${DC(s.d)}"><div class="top"><span class="day">DAY${s.d} ${esc(DAYS()[s.d-1].date)}</span></div><div class="nm">${esc(s.n)}</div><div class="slots">${slot("sai")}${slot("yui")}</div>${ok?stampSVG(s.n,!seen.has(s.id)):""}</div>`}).join("")||`<div class="empty">スタンプの場所がまだありません。しおりの「この日を編集」で、行き先に「スタンプの場所にする」をつけてね。</div>`}</div>
  <div class="treasure">${chest}<div>${all?`<h3 style="font-size:17px">隠しメッセージ</h3><div class="msg">${esc(S.secret??DEFAULT_SECRET)}</div>`:`<h3 style="font-size:17px">？？？の宝箱</h3><div class="small muted">スタンプがぜんぶそろうと、宝箱がひらきます。</div>`}
    ${S.isOwner&&!all?`<details style="margin-top:6px"><summary class="small">宝箱のメッセージを書きかえる（さいけうだけに見えています）</summary><textarea id="secret-in" maxlength="1000" aria-label="宝箱のメッセージ">${esc(S.drafts.secret??S.secret??DEFAULT_SECRET)}</textarea><button class="btn" id="secret-save" style="margin-top:8px">保存</button></details>`:""}</div>
  </div>`;
  const newly=done.filter(id=>!seen.has(id));
  if(newly.length){ls.set("seenStamps",done.join(","));confetti();beep("stamp");react("stamp");if(all)setTimeout(()=>{toast("全スタンプ制覇！宝箱がひらいたよ");beep("open");cheer("ぜんぶ集めた！","宝箱ひらいた！")},700)}
}
let pendingSpot=null;
$("#v-stamp").addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.up){pendingSpot=t.dataset.up;$("#f-stamp").click()}
  else if(t.dataset.open){const list=S.photos.filter(p=>p.spot);openLB(list,list.findIndex(p=>p.id===t.dataset.open))}
  else if(t.id==="secret-save"){try{await S.db.doc("config/secret").set({msg:$("#secret-in").value});delete S.drafts.secret;toast("保存しました")}catch(err){writeErr(err)}}
});
$("#f-stamp").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f||!pendingSpot)return;
  const spot=SPOTS().find(s=>s.id===pendingSpot);if(!spot)return;S.busy=S.busy||{};if(S.busy["spot:"+spot.id])return;S.busy["spot:"+spot.id]=true;if(S.view==="stamp")renderStamp();toast("アップロード中…");
  try{await uploadPhoto(f,{spot:spot.id,day:spot.d});toast(spotPhotos(spot.id)[other(S.who)]?"スタンプゲット！":`${NAME[other(S.who)]}の写真を待ってるよ`)}catch(err){upErr(err)}
  finally{delete S.busy["spot:"+spot.id];if(S.view==="stamp")safeRender()}});

/* ---------- 日記 ---------- */
function renderDiary(){
  const n=S.diaryDay,mine=S.diary[`d${n}_${S.who}`],theirs=S.diary[`d${n}_${other(S.who)}`];
  const both=mine&&theirs,o=other(S.who);

  const lock=`<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M30 52s-20-12-20-28a11 11 0 0 1 20-6 11 11 0 0 1 20 6c0 16-20 28-20 28z" fill="#ff5c93" stroke="#23314f" stroke-width="3"/><rect x="21" y="26" width="18" height="14" rx="3" fill="#ffd23f" stroke="#23314f" stroke-width="2.5"/><path d="M24 26v-4a6 6 0 0 1 12 0v4" fill="none" stroke="#23314f" stroke-width="2.5"/></svg>`;
  $("#v-diary").innerHTML=`
  ${HEAD("ふたりの交換日記","var(--hibiscus)","1日1回、一言ずつ")}
  ${dayPicker(n,"dd")}
  ${night?`<div class="banner"><span class="moon"></span>1日のしめくくり。今日の日記を書こう</div>`:""}
  <div class="diary">
    <div class="page ${S.who}"><h3><img src="${MII[S.who]}" alt="">${NAME[S.who]}（あなた）</h3>
      ${S.canWrite?`<textarea id="diary-in" maxlength="2000" placeholder="今日いちばん楽しかったことは？">${esc(S.drafts["diary:"+n]??mine?.text??"")}</textarea><button class="btn pink" id="diary-save">${mine?"書き直して保存":"書いた！"}</button>`:`<div class="body">${esc(mine?.text||"")}</div>`}
    </div>
    <div class="page ${o}"><h3><img src="${MII[o]}" alt="">${NAME[o]}</h3>
      ${both?`<div class="body">${esc(theirs.text)}</div>`:`<div class="sealed"><div>${lock}${theirs?`${NAME[o]}は書き終わったよ。<br>あなたが書くと、ふたりの日記がひらきます`:mine?`${NAME[o]}が書くのを待っています`:`ふたりとも書いたら、ここに${NAME[o]}の日記が出てきます`}</div></div>`}
    </div>

async function decode(file){try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch{}
  return await new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej({code:"decode"})};i.src=u})}
function toJpeg(src,max,q){const w=src.width,h=src.height,s=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(src,0,0,c.width,c.height);return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej({code:"encode"}),"image/jpeg",q))}
async function uploadPhoto(file,{spot=null,day=0,food=null}){
  if(!S.assets)throw{code:"not_granted"};
  const img=await decode(file);
  // 保存先の容量（無料枠1GB）を考えて、長辺2560pxに整えて保存（スマホで見るには十分な高画質）
  const W=img.width,H=img.height;const full=await toJpeg(img,2560,.88);const thumb=await toJpeg(img,720,.8);try{img.close?.()}catch{}
  const [F,T]=await Promise.all([S.assets.upload(full,{type:"image/jpeg"}),S.assets.upload(thumb,{type:"image/jpeg"})]);
  await ensureUrls([F.id,T.id]);
  await S.db.collection("photos").add({full:F.id,thumb:T.id,w:W,h:H,who:S.who,day,spot,food,at:Date.now()});
}

async function downloadBlob(name,b){

  const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}

function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=document.createElement("canvas");c.className="confetti";c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const g=c.getContext("2d"),cs=getComputedStyle(document.documentElement),cols=["--sun","--shu","--sea","--leaf","--hibiscus"].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.3,vy:2+Math.random()*3,vx:-1.5+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function tick(){g.clearRect(0,0,c.width,c.height);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.r+=.1;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()}
    if(++f<120)requestAnimationFrame(tick);else c.remove()})();
}

  // 対処
  if(run!==diagRun)return;
  const fx=$("#diag-fix");if(!fx)return;const u=[...new Set(fixes)];
  if(!u.length){fx.hidden=false;fx.innerHTML=`<b>ぜんぶOKです。</b> いま出ている不具合は、電波が弱かったときの一時的なものの可能性が高いです。もう一度同じ操作をしてみてね。`;return}
  fx.hidden=false;

    (u.includes("login")?`<div style="margin-top:6px"><b>ログインし直してください。</b> <button class="btn mini" id="diag-login">ログイン画面へ</button></div>`:"")+

const BUCKET="photos";
const URL_INFLIGHT=new Map();
async function ensureUrls(ids){
  const missing=[...new Set(ids.filter(id=>id&&!URLS[id]))];if(!missing.length)return;
  const waits=[],fresh=[];for(const id of missing){if(URL_INFLIGHT.has(id))waits.push(URL_INFLIGHT.get(id));else fresh.push(id)}
  if(fresh.length){const job=(async()=>{let failed=false;
    for(let i=0;i<fresh.length;i+=200){const chunk=fresh.slice(i,i+200);
      try{const {data,error}=await withRetry(()=>sb.storage.from(BUCKET).createSignedUrls(chunk,60*60*24*7).then(r=>{if(r.error)throw r.error;return r}),"storage");if(error)throw error;for(const r of data||[]){if(r.signedUrl&&!r.error)URLS[r.path]=r.signedUrl}}
      catch(e){console.warn("signed urls",e);failed=true;S.urlErr=e}}
    fresh.forEach(id=>URL_INFLIGHT.delete(id));
    if(failed){const bar=$("#sysbar");if(!bar||bar.hidden){const i=errInfo(S.urlErr,"storage");setSysbar("写真を読み込めませんでした："+i.msg,"urls")}}})();
    fresh.forEach(id=>URL_INFLIGHT.set(id,job));waits.push(job)}
  await Promise.all(waits);
}
function makeDb(){
  const cache=new Map();          // collection -> Map(id -> data)
  const listeners=[];
  const col=c=>{if(!cache.has(c))cache.set(c,new Map());return cache.get(c)};
  const snapDoc=(c,id)=>{const d=col(c).get(id);return {id,exists:!!d,data:()=>d}};
  const snapCol=c=>{const docs=[...col(c).entries()].map(([id,d])=>({id,exists:true,data:()=>d}));return {docs,size:docs.length,empty:!docs.length}};
  const notify=(c,id)=>{for(const l of listeners){if(l.c!==c)continue;if(l.id&&l.id!==id)continue;try{l.fn(l.id?snapDoc(c,l.id):snapCol(c))}catch(e){console.warn(e)}}};
  const split=p=>{const s=p.split("/");return [s.slice(0,-1).join("/"),s[s.length-1]]};
  const deepMerge=(a,b)=>{const o={...(a||{})};for(const k in b){o[k]=(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k]))?deepMerge(a[k],b[k]):b[k]}return o};
  const pending=new Map();        // "collection/id" -> 書き込み通し番号（最新だけが結果を反映する）
  const stable=v=>Array.isArray(v)?`[${v.map(stable).join(",")}]`:v&&typeof v==="object"?`{${Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+stable(v[k])).join(",")}}`:JSON.stringify(v);
  const notReady=()=>Object.assign(new Error("まだデータの読み込みが終わっていません。少し待ってからもう一度押してね"),{code:"not_ready",where:"db"});
  async function write(c,id,data){
    if(!db.ready)throw notReady();
    const key=c+"/"+id,seq=(pending.get(key)||0)+1;pending.set(key,seq);
    const prev=col(c).get(id);col(c).set(id,data);notify(c,id);
    try{await withRetry(async()=>{const {error}=await sb.from("docs").upsert({collection:c,id,data,updated_at:new Date().toISOString()},{onConflict:"collection,id"});if(error)throw error},"db");
      if(pending.get(key)===seq){pending.delete(key);if(col(c).get(id)!==data){col(c).set(id,data);notify(c,id)}}}
    catch(error){console.warn(error);if(pending.get(key)===seq){pending.delete(key);if(prev===undefined)col(c).delete(id);else col(c).set(id,prev);notify(c,id)}
      throw Object.assign(new Error(error?.message||String(error)),{code:error?.code,status:error?.status,where:"db"})}}
  const docRef=(c,id)=>({id,path:c+"/"+id,
    get:async()=>snapDoc(c,id),
    set:data=>write(c,id,JSON.parse(JSON.stringify(data))),
    update:async patch=>{const cur=col(c).get(id);if(!cur)throw {code:"invalid_argument",message:"no doc"};return write(c,id,deepMerge(cur,JSON.parse(JSON.stringify(patch))))},
    delete:async()=>{if(!db.ready)throw notReady();const key=c+"/"+id,seq=(pending.get(key)||0)+1;pending.set(key,seq);const prev=col(c).get(id);col(c).delete(id);notify(c,id);
      try{await withRetry(async()=>{const {error}=await sb.from("docs").delete().match({collection:c,id});if(error)throw error},"db");if(pending.get(key)===seq)pending.delete(key)}
      catch(error){if(pending.get(key)===seq){pending.delete(key);if(prev!==undefined){col(c).set(id,prev);notify(c,id)}}throw Object.assign(new Error(error?.message||String(error)),{code:error?.code,where:"db"})}},
    onSnapshot:(fn)=>{const l={c,id,fn};listeners.push(l);if(db.ready)fn(snapDoc(c,id));return()=>{const i=listeners.indexOf(l);if(i>=0)listeners.splice(i,1)}}});
  const colRef=c=>({path:c,doc:id=>docRef(c,id||uid()+uid()),add:async data=>{const r=docRef(c,Date.now().toString(36)+uid());await r.set(data);return r},
    onSnapshot:(fn)=>{const l={c,id:null,fn};listeners.push(l);if(db.ready)fn(snapCol(c));return()=>{const i=listeners.indexOf(l);if(i>=0)listeners.splice(i,1)}}});
  const db={ready:false,doc:p=>{const [c,id]=split(p);return docRef(c,id)},collection:c=>colRef(c),
    async load(){const PAGE=1000,rows=[];   // 1000件ずつ（写真が増えても取りこぼさない）
      for(let from=0;;from+=PAGE){const {data,error}=await withRetry(()=>sb.from("docs").select("collection,id,data").order("collection").order("id").range(from,from+PAGE-1).then(r=>{if(r.error)throw r.error;return r}),"db");
        if(error)throw error;rows.push(...(data||[]));if(!data||data.length<PAGE)break}
      const keep=[...pending.keys()].map(k=>{const [c,id]=split(k);return [c,id,col(c).get(id)]});   // 送信中の自分の変更は消さない
      cache.clear();for(const r of rows)col(r.collection).set(r.id,r.data);for(const [c,id,v] of keep)if(v!==undefined)col(c).set(id,v);
      db.ready=true;for(const c of new Set(listeners.map(l=>l.c))){for(const l of listeners.filter(x=>x.c===c)){try{l.fn(l.id?snapDoc(c,l.id):snapCol(c))}catch(e){console.warn(e)}}}},
    subscribe(){if(db.channel)return;db.channel=sb.channel("docs-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
        if(p.eventType==="DELETE"){const o=p.old;if(o&&o.collection&&!pending.has(o.collection+"/"+o.id)){col(o.collection).delete(o.id);notify(o.collection,o.id)}return}
        const n=p.new;if(!n||pending.has(n.collection+"/"+n.id))return;const prev=col(n.collection).get(n.id);if(stable(prev)===stable(n.data))return;col(n.collection).set(n.id,n.data);notify(n.collection,n.id)})
      .subscribe((st,err)=>{S.rtStatus=st;if(st==="CHANNEL_ERROR"||st==="TIMED_OUT")console.warn("realtime",st,err?.message||"")})},
    async refresh(){try{await db.load();return true}catch(e){console.warn(e);return false}}};
  return db;
}
const assetsApi={async upload(b,{type}={}){const ext=(type||b.type||"image/jpeg").split("/")[1]||"jpg";const path=`${Date.now().toString(36)}-${uid()}${uid()}.${ext}`;
  try{await withRetry(async()=>{const {error}=await sb.storage.from(BUCKET).upload(path,b,{contentType:type||b.type||"image/jpeg",upsert:true});if(error)throw error},"storage")}

  sub("missions",s=>{S.missions={};s.docs.forEach(d=>S.missions[d.id]=d.data());if(S.view==="plan"||S.view==="result")safeRender()});
  sub("diary",s=>{S.diary={};s.docs.forEach(d=>S.diary[d.id]=d.data());safeRender()});
  db.doc("config/secret").onSnapshot(d=>{S.secret=d.exists?d.data().msg:null;if(S.view==="stamp")safeRender()});
  db.doc("prep/items").onSnapshot(d=>{S.items=d.exists?d.data():null;if(S.view==="plan")safeRender()});
  sub("letters",s=>{S.letters={};s.docs.forEach(d=>S.letters[d.id]=d.data());if(S.view==="diary"||S.view==="plan")safeRender()});
  // 相手の動きに反応（上の購読のあとに登録するので、S.* は更新済み）
  for(const c of ["photos","missions","diary","letters"])db.collection(c).onSnapshot(()=>{if(db.ready)partnerWatch()});
  db.doc("trip/plan").onSnapshot(()=>{if(db.ready)partnerWatch()});db.doc("prep/items").onSnapshot(()=>{if(db.ready)partnerWatch()});
  db.subscribe();   // 読み込み中の変更も取りこぼさないよう、先に購読
  render();
  try{await db.load();S.canWrite=true;setSysbar(null);let g=false;try{g=!!sessionStorage.getItem("greeted");sessionStorage.setItem("greeted","1")}catch{}
    if(!g){const wait=()=>{const spl=$("#splash");if((spl&&!spl.hidden)||$("#layer").innerHTML){setTimeout(wait,400);return}setTimeout(greet,900)};setTimeout(wait,600)}}catch(e){console.warn(e);const i=errInfo(e,"db");S.lastErr={at:Date.now(),where:"db(load)",msg:i.msg,raw:String(e?.message||e)};
    setSysbar(i.kind==="setup"?`保存先の設定がまだのようです：${i.msg}`:i.kind==="network"?"電波がとどかず、データを読み込めませんでした（読み込めるまで保存はできません）":"データを読み込めませんでした："+i.msg,i.kind==="network"?"retry":"diag");
    if(i.kind==="network")setTimeout(async()=>{if(await db.refresh()){S.canWrite=true;setSysbar(null);render()}},4000)}
  setTimeout(geocodeMissing,4000);
  document.addEventListener("visibilitychange",async()=>{if(document.hidden)return;if(await db.refresh()){if(!S.canWrite){S.canWrite=true;setSysbar(null);render()}}});
  render();
}
