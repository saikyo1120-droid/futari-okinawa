<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13b5c8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="島ぐらし">
<meta name="description" content="さいけうとゆいちゃんの沖縄5泊6日誕生日旅行「おめで島ぐらし」、ふたりだけのサイト">
<meta name="robots" content="noindex,nofollow">
<title>おめで島ぐらし</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="supabase.js"></script>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,sans-serif;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Dela+Gothic+One&family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: 上に「ふたりが立つ南の島」の一枚絵（海・波・雲が動く）、その下に砂浜のボードに今の画面。下のカラフルなタブで5画面を切り替える。
   明るい昼の島で統一（ダークモードでも同じ）。夕方・夜は空の色だけ変わる。 */
:root{
  color-scheme:light;
  --sea:#13b5c8; --sea-deep:#0a7f9c; --lagoon:#7fe3e6; --foam:#e9fbfb;
  --sand:#fbe7b5; --sand-deep:#e9c47a;
  --grass:#7ccb45; --leaf:#3fae49;
  --shu:#ee4b3a; --sun:#ffd23f; --hibiscus:#ff5c93; --ai:#2f4fb5;
  --ink:#23314f; --muted:#46587a; --paper:#ffffff; --card:#fffdf6; --line:#f0dfb4;
  --pop:"Mochiy Pop One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --pixel:"DotGothic16","Osaka-mono",monospace;
  --d1:#ee4b3a; --d2:#f5a524; --d3:#13b5c8; --d4:#2f4fb5; --d5:#ff5c93; --d6:#3fae49;
}
*{box-sizing:border-box}
html{background:#0d7ea6}
body{margin:0;overflow-x:clip;color:var(--ink);font-family:var(--body);font-weight:700;font-size:15px;line-height:1.7;
  background-color:#0d7ea6;background-image:linear-gradient(180deg,rgba(0,40,70,0) 0,rgba(0,30,60,.25) 100%),url("water.webp");background-size:100% 100%,420px 420px;background-attachment:scroll;padding-block:0 104px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--pop);font-weight:400;margin:0;line-height:1.3;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
a{color:var(--sea-deep);font-weight:700}
.muted{color:var(--muted)}.small{font-size:13.5px}
.btn{border:3px solid var(--ink);background:var(--sun);color:var(--ink);border-radius:999px;padding:8px 20px;font-family:var(--pop);font-size:15px;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.sea{background:var(--sea);color:#fff}.btn.pink{background:var(--hibiscus);color:#fff}.btn.ghost{background:#fff}
.btn.mini{padding:3px 12px;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default}

/* ============ 島のヒーロー（レイヤー） ============ */
.island{position:relative;margin:0 calc(50% - 50vw);width:100vw;height:clamp(600px,152vw,720px);overflow:hidden;background:#5cc9f5}
.island .ly{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%;display:block;max-width:none;pointer-events:none}
.island .ly.sea{animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-3px) scaleY(1.012)}}
.island .ly.glow{mix-blend-mode:screen}
.island .ly.g1{animation:caus1 9s ease-in-out infinite}
.island .ly.g2{animation:caus2 11s ease-in-out infinite;opacity:.8}
@keyframes caus1{0%,100%{transform:translate(0,0);opacity:.9}50%{transform:translate(14px,4px);opacity:.5}}
@keyframes caus2{0%,100%{transform:translate(0,0);opacity:.4}50%{transform:translate(-16px,-3px);opacity:.9}}
.island .ly.foam{animation:lap 5.5s ease-in-out infinite}
@keyframes lap{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(7px) scaleY(.97);opacity:.75}}
.island .ly.foam2{animation:lap2 5.5s ease-in-out infinite;opacity:.5}
@keyframes lap2{0%,100%{transform:translateY(-9px) scaleY(1.03);opacity:.15}50%{transform:translateY(-1px);opacity:.6}}
.glints i{position:absolute;width:18px;height:3px;border-radius:2px;background:#fff;box-shadow:0 0 6px #fff;opacity:0;animation:twinkle 3.2s ease-in-out infinite}
.glints i:nth-child(2n){animation-delay:-1.1s;width:12px}.glints i:nth-child(3n){animation-delay:-2.2s}
@keyframes twinkle{0%,100%{opacity:0;transform:scaleX(.4)}50%{opacity:.95;transform:scaleX(1)}}
.softcloud{position:absolute;height:60px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.85),rgba(255,255,255,0));animation:drift 70s linear infinite;pointer-events:none}
.softcloud.a{top:8%;width:220px}.softcloud.b{top:22%;width:160px;height:44px;animation-duration:95s;animation-delay:-40s;opacity:.8}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(110vw)}}
/* 時間帯で空が変わる */
.skytint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.5s;mix-blend-mode:multiply}
body[data-sky="dusk"] .skytint{opacity:1;background:linear-gradient(180deg,#ff9a5c 0%,#ffcf8a 30%,#ffe9c2 50%,#fff 70%)}
body[data-sky="night"] .skytint{opacity:1;background:linear-gradient(180deg,#1b2a6b 0%,#2b4a9a 35%,#5a86c8 55%,#a7c6ea 75%,#fff 100%)}
body[data-sky="dawn"] .skytint{opacity:1;background:linear-gradient(180deg,#f9b8c8 0%,#ffe0c8 40%,#fff 70%)}
.stars{position:absolute;inset:0 0 50%;pointer-events:none;opacity:0;transition:opacity 1.5s;
  background-image:radial-gradient(circle,#fff 1.2px,transparent 2px),radial-gradient(circle,#fff 1px,transparent 1.8px),radial-gradient(circle,#fff .8px,transparent 1.6px);
  background-size:140px 120px,90px 80px,60px 70px;background-position:10px 20px,40px 60px,70px 10px}
body[data-sky="night"] .stars{opacity:.9;animation:twinkle2 4s ease-in-out infinite}
@keyframes twinkle2{0%,100%{opacity:.9}50%{opacity:.55}}
.moonbig{position:absolute;right:14%;top:9%;width:54px;height:54px;border-radius:50%;background:#fff6c8;box-shadow:0 0 30px 8px rgba(255,246,200,.5);opacity:0;transition:opacity 1.5s;pointer-events:none}
body[data-sky="night"] .moonbig{opacity:1}

/* ============ ロゴ（黄色いもこもこ吹き出し） ============ */
.logo{position:absolute;left:50%;top:30px;transform:translateX(-50%);z-index:3;width:min(76%,380px);aspect-ratio:740/537;container-type:inline-size;
  filter:drop-shadow(0 5px 0 rgba(35,49,79,.2)) drop-shadow(0 12px 16px rgba(0,30,60,.28));animation:logo-in .9s cubic-bezier(.2,1.5,.4,1) both}
@keyframes logo-in{from{transform:translateX(-50%) scale(.4) rotate(-8deg);opacity:0}to{transform:translateX(-50%);opacity:1}}
.lg-blob{position:absolute;inset:0;width:100%;height:100%;display:block;max-width:none}
.lg-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lg-svg text{text-anchor:middle;paint-order:stroke fill;stroke-linejoin:round;stroke-linecap:round}
.lg-main{transform:rotate(-2deg);transform-origin:370px 280px;filter:drop-shadow(0 7px 0 rgba(70,40,0,.22))}
.lg-main text{font-family:"Dela Gothic One",var(--pop);font-size:120px;letter-spacing:8px;fill:#121212;stroke:#fff;stroke-width:16px}
.lg-daku .dk-out{fill:none;stroke:#fff;stroke-width:34px;stroke-linecap:round}
.lg-daku .dk-in{fill:none;stroke:#121212;stroke-width:18px;stroke-linecap:round}
.lg-sub{font-family:var(--pop);font-size:58px;letter-spacing:2px;stroke:#fff;stroke-width:8px;filter:drop-shadow(0 4px 0 rgba(70,40,0,.18));animation:sub-bob 3s ease-in-out infinite;transform-origin:370px 420px}
@keyframes sub-bob{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.lg-date{font-family:var(--body);font-weight:900;font-size:22px;letter-spacing:3px;fill:#7a5a00}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lg-bubble{position:absolute;left:2%;top:-9%;z-index:2;background:#fff;color:#111;border-radius:999px;padding:.38em 1em;font-family:"Dela Gothic One",var(--pop);font-size:clamp(11px,4.1cqw,19px);line-height:1.2;white-space:nowrap;box-shadow:0 2px 0 rgba(35,49,79,.18);transform:rotate(-3deg);animation:bubble-in .7s .5s cubic-bezier(.2,1.6,.4,1) both}
.lg-bubble::after{content:"";position:absolute;left:22%;bottom:-.6em;width:1em;height:.75em;background:#fff;clip-path:polygon(0 0,100% 0,35% 100%)}
@keyframes bubble-in{from{transform:rotate(-3deg) scale(0);opacity:0}to{transform:rotate(-3deg);opacity:1}}
.sndbtn{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;z-index:4;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0}
.sndbtn.wavebtn{top:58px;color:var(--sea-deep)}
.sndbtn.wavebtn[aria-pressed="true"]{background:var(--sea);color:#fff}
.sndbtn svg{width:22px;height:22px}.sndbtn .off{display:none}.sndbtn[aria-pressed="false"] .on{display:none}.sndbtn[aria-pressed="false"] .off{display:block}

.miis{position:absolute;left:0;right:0;bottom:7%;display:flex;justify-content:center;align-items:flex-end;gap:clamp(2px,2vw,22px);z-index:2}
.mii{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mii img{height:clamp(200px,56vw,280px);width:auto;display:block;position:relative;z-index:1;animation:hop 3.2s ease-in-out infinite;transform-origin:50% 100%}
.mii.yui img{animation-delay:-1.6s;height:calc(clamp(200px,56vw,280px)*.93)}
.mii.kon img{animation:hop 2.1s ease-in-out infinite;animation-delay:-.7s;height:calc(clamp(200px,56vw,280px)*.5)}
.mii.kon .nameplate{background:#dff3ff;font-size:11.5px;padding:0 9px}
.mii.kon .bubble.talk{background:#eef7ff;left:auto;right:-6px;transform:translateX(0) scale(.6);transform-origin:85% 100%;max-width:min(170px,46vw)}.mii.kon .bubble.talk.show{transform:translateX(0) scale(1)}.mii.kon .bubble.talk::after{background:#eef7ff;left:auto;right:22px}
.konlove{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:900;margin-top:8px;color:var(--muted)}
.konlove img{height:28px;width:auto}
.konlove b{color:var(--hibiscus);letter-spacing:1px;font-size:15px}.konlove b i{color:#d9d9d9;font-style:normal}
.konlove span{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 8px;color:var(--ink)}
.konlove small{font-weight:700;font-size:10.5px;opacity:.8}
.mii img.jump{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
.mii img.bigjump{animation:bigjump .75s cubic-bezier(.3,1.5,.5,1)}
@keyframes bigjump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-48px) scale(.94,1.1) rotate(-4deg)}60%{transform:translateY(-30px) scale(1,1) rotate(4deg)}100%{transform:translateY(0) scale(1.04,.96)}}
.mii img.shake{animation:shake .6s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg) translateX(-4px)}40%{transform:rotate(6deg) translateX(4px)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
.mii img.sway{animation:sway 2.4s ease-in-out}
@keyframes sway{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg) translateY(2px)}70%{transform:rotate(3deg) translateY(2px)}}
.mii img.hop2{animation:hop2 .7s ease-in-out}
@keyframes hop2{0%,100%{transform:translateY(0)}25%{transform:translateY(-14px)}50%{transform:translateY(0) scale(1.03,.97)}75%{transform:translateY(-10px)}}
.mii img.run{animation:run .22s ease-in-out 6}
@keyframes run{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(.97,1.04)}}
.mii{transition:transform .45s cubic-bezier(.3,1.3,.5,1);-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.mii img{-webkit-user-drag:none}
.mii.look-l{transform:rotate(-4deg) translateX(-4px)}.mii.look-r{transform:rotate(4deg) translateX(4px)}
.mii.kon{transition:transform .75s cubic-bezier(.3,1.3,.5,1)}
.mii.kon.run{z-index:4}
.fxp{position:absolute;top:6%;width:20px;height:20px;pointer-events:none;z-index:6;opacity:0;animation:fxfloat 1.5s ease-out forwards}
.fxp svg{width:100%;height:100%;overflow:visible;display:block}
.fxt{font-family:var(--pop);color:var(--ink);font-size:16px;line-height:1;text-shadow:0 0 4px #fff,0 0 4px #fff}
.fxt.ex{color:var(--shu);font-size:28px}.fxt.q{color:var(--ai);font-size:26px}
@keyframes fxfloat{0%{transform:translate(-50%,0) scale(.3) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),-80px) scale(1) rotate(var(--r));opacity:0}}
@keyframes jump{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-26px) scale(.96,1.06)}100%{transform:translateY(0) scale(1)}}
.mii::after{content:"";position:absolute;bottom:22px;width:70%;height:14px;border-radius:50%;background:rgba(80,60,20,.18)}
@keyframes hop{0%,82%,100%{transform:translateY(0) scale(1,1)}88%{transform:translateY(-14px) scale(.98,1.03)}94%{transform:translateY(0) scale(1.03,.97)}}
.nameplate{margin-top:-4px;position:relative;z-index:2;background:#fff;border:3px solid var(--ink);border-radius:99px;padding:0 12px;font-weight:900;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.mii.sai .nameplate{background:var(--lagoon)}.mii.yui .nameplate{background:#ffd0e0}
.mii.kon::after{bottom:16px;height:9px}
.bubble{position:absolute;z-index:3;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:6px 12px;font-weight:900;font-size:13px;line-height:1.4;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.bubble::after{content:"";position:absolute;bottom:-12px;width:16px;height:16px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.island.talking .bubble.count{opacity:0;transition:opacity .2s}
.bubble.count{transition:opacity .4s .3s;left:50%;transform:translateX(-50%);bottom:calc(7% + clamp(200px,56vw,280px) + 20px);font-family:var(--body);font-weight:900;font-size:14px;animation:float 3s ease-in-out infinite}
.bubble.count::after{left:calc(50% - 8px);bottom:-11px}
.bubble.count b{font-family:var(--pop);font-size:26px;color:var(--shu);font-weight:400;font-variant-numeric:tabular-nums}
.bubble.count .th{display:block;font-size:11.5px;color:var(--sea-deep);letter-spacing:.08em;margin-top:-2px;font-weight:900}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
.bubble.talk{bottom:calc(100% - 10px);left:50%;transform:translateX(-50%) scale(.6);opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;z-index:5;background:#fffbe6;width:max-content;max-width:min(200px,56vw);white-space:normal;text-align:center;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.bubble.talk::after{left:calc(50% - 8px);background:#fffbe6}
.bubble.talk.show{opacity:1;transform:translateX(-50%) scale(1)}
.mii.yui .bubble.talk{background:#fff0f5}.mii.yui .bubble.talk::after{background:#fff0f5}

/* ============ タブ ============ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sand) url("sandtex.webp") 0 0/256px 256px;border-top:4px solid var(--ink);box-shadow:0 -6px 18px rgba(0,30,60,.25);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.tab{--c:var(--sea);border:3px solid var(--ink);background:#fff;border-radius:16px;padding:4px 2px 3px;font-size:11px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:0 3px 0 var(--ink);transition:transform .1s}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{background:var(--c);color:#fff;transform:translateY(-4px);box-shadow:0 7px 0 var(--ink)}
.tab:nth-child(1){--c:var(--shu)}.tab:nth-child(2){--c:#f5a524}.tab:nth-child(3){--c:var(--hibiscus)}.tab:nth-child(4){--c:var(--sea)}.tab:nth-child(5){--c:var(--leaf)}.tab:nth-child(6){--c:var(--ai)}
@media (max-width:420px){.tab{font-size:10px;padding:3px 0 2px}.tab svg{width:22px;height:22px}}

/* ============ ステータス ============ */
.status{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media (max-width:480px){.status{grid-template-columns:1fr}}
.pcard{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 10px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 var(--ink);min-width:0}
.pcard img{height:64px;width:auto;flex:0 0 auto}
.pcard.sai{background:linear-gradient(135deg,#e6fbfc,#fff)}.pcard.yui{background:linear-gradient(135deg,#ffeef4,#fff)}
.pc-in{min-width:0;flex:1}
.pc-name{font-family:var(--pop);font-size:16px;display:flex;align-items:center;gap:8px}
.lv{font-family:var(--pop);font-size:13px;background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:0 9px;line-height:1.5}
.pc-stats{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.stat{--c:var(--sea);display:inline-flex;align-items:center;gap:5px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 9px 1px 3px;box-shadow:0 2px 0 var(--ink)}
.stat i{font-style:normal;font-size:11px;font-weight:900;background:var(--c);color:#fff;border-radius:999px;padding:0 8px;line-height:1.7;letter-spacing:.02em}
.stat.ink i{color:var(--ink)}
.stat b{font-family:var(--pop);font-weight:400;font-size:17px;color:var(--ink);line-height:1.1;min-width:1ch;text-align:center}
.love{grid-column:1/-1;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 var(--ink)}
.love-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:900}
.love-h b{font-family:var(--pop);font-size:22px;color:var(--hibiscus);font-weight:400}
.love-bar{height:14px;border:3px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff;margin:4px 0}
.love-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hibiscus),var(--sun));transition:width .8s}
.love-s{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.love-s span{font-size:11.5px;font-weight:900;color:var(--ink);background:var(--sand);border:2px solid var(--ink);border-radius:999px;padding:0 8px;line-height:1.7}
.love-s span b{font-family:var(--pop);font-weight:400;font-size:13px;margin-left:3px}

/* ============ 画面切り替え ============ */
main.enter section.view:not([hidden]){animation:enter .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}

/* ============ オープニング ============ */
.splash{position:fixed;inset:0;z-index:100;background:#13b5c8 url("water.webp") 0 0/384px 384px;display:grid;place-items:center;transition:opacity .6s,transform .6s;cursor:pointer;
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.splash-in{display:grid;grid-template-columns:1fr 1fr;justify-items:center;align-items:end;width:100%;max-width:560px;position:relative;padding-top:min(62vw,300px)}
.splash .logo{top:0;width:min(94%,460px);animation-delay:.1s}
.splash-mii{height:clamp(190px,46vw,280px);width:auto;animation:sin .8s cubic-bezier(.2,1.5,.4,1) both}
.splash-mii.l{animation-delay:.25s;transform-origin:50% 100%}.splash-mii.r{animation-delay:.4s}
.splash-mii.k{position:absolute;right:4%;bottom:-6px;height:clamp(95px,23vw,140px);animation-delay:.55s}
@keyframes sin{from{transform:translateY(60px) scale(.7);opacity:0}to{transform:none;opacity:1}}
.splash-tap{position:absolute;bottom:calc(40px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-weight:900;animation:blink 1.4s ease-in-out infinite;text-shadow:1px 1px 0 var(--ink)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ============ 行程エディター ============ */
.modal .box.editor{text-align:left;max-width:560px;max-height:calc(100vh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:#fff}
.ed-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.ed-head h2{font-size:20px;color:var(--c)}
.ed-head .x{border:3px solid var(--ink);background:#fff;border-radius:50%;width:36px;height:36px;font-family:var(--pop);font-size:18px;line-height:1;box-shadow:0 3px 0 var(--ink)}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.ed-grid{grid-template-columns:1fr}}
.fld{display:grid;gap:2px;font-size:12.5px;font-weight:900;color:var(--ink);margin-bottom:8px}
.fld input,.fld textarea,.ed-stop input{width:100%;border:2px solid var(--ink);border-radius:10px;padding:6px 8px;font:inherit;font-size:14px;color:var(--ink);background:#fff;min-width:0}
.fld textarea{min-height:60px;resize:vertical}
.ed-stops{display:grid;gap:8px;margin:6px 0 10px}
.ed-stop{background:var(--sand);border:2px solid var(--ink);border-radius:14px;padding:8px;display:grid;gap:6px}
.ed-stop-row{display:grid;grid-template-columns:72px 1fr auto;gap:6px;align-items:center}
@media (max-width:480px){.ed-stop-row{grid-template-columns:64px 1fr}.ed-stop-row .ed-btns{grid-column:1/-1;justify-content:flex-end}}
/* iPhoneは16px未満の入力欄にフォーカスすると画面が勝手に拡大するので、入力欄は16px */
@media (max-width:760px){.fld input,.fld textarea,.ed-stop input,.pk-search input,.pk-paste-in input,.iadd input,.iadd select,.page textarea,.letter textarea,.treasure textarea{font-size:16px}}
.ed-stop-row2{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
@media (max-width:480px){.ed-stop-row2{grid-template-columns:1fr}}
.ed-btns{display:flex;gap:4px}
.ed-btns button{border:2px solid var(--ink);background:#fff;border-radius:8px;width:30px;height:30px;padding:0;font-size:12px;font-weight:900}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;white-space:nowrap}
.chk input{width:18px;height:18px;accent-color:var(--shu)}
.ed-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.st-badge{display:inline-block;margin-left:6px;font-size:10px;background:var(--shu);color:#fff;border-radius:99px;padding:0 7px;vertical-align:middle;font-weight:900}
.daycard .ribbon .theme{font-size:12.5px;font-weight:900;background:rgba(255,255,255,.22);border-radius:999px;padding:0 9px;margin-left:auto}

/* ============ 島ニュース ============ */
.news{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--ink);margin-bottom:14px}
.news-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.news-tag{font-family:var(--pop);font-size:14px;background:var(--ai);color:#fff;border-radius:10px;padding:1px 10px}
.news ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.news li{font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:baseline;padding:3px 0;border-top:1px dashed var(--line)}
.news li:first-child{border-top:0}
.news .when{font-size:11px;font-weight:900;color:var(--sea-deep);background:var(--foam);border-radius:999px;padding:0 7px;flex:0 0 auto;line-height:1.7}
.news li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sea);flex:0 0 auto;align-self:center}
.news li.k-stamp::before,.news li.k-done::before{background:var(--shu)}.news li.k-food::before{background:var(--leaf)}.news li.k-diary::before,.news li.k-letter::before{background:var(--hibiscus)}.news li.k-mission::before{background:#f5a524}.news li.k-plan::before{background:var(--ai)}
/* ============ 日の出・月 ============ */
.sunrow{display:flex;gap:8px 10px;flex-wrap:wrap;font-size:12.5px;font-weight:900;color:var(--ink);margin:8px 0 4px}
.sunrow .sr{background:#fff;border:2px solid var(--line);border-radius:999px;padding:1px 9px 1px 5px}
.sunrow .sr{display:inline-flex;align-items:center;gap:4px}
.sunrow svg{width:20px;height:20px}
.moon-svg{width:20px;height:20px}
.daytabs button.today{position:relative}
.daytabs button.today::after{content:"";position:absolute;right:-5px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--shu);border:2px solid #fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
/* ============ 持ち物 ============ */
.items{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.item{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 8px 6px 12px;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;transition:background .3s}
.item.both{background:linear-gradient(90deg,#fff8d6,#e6fbfc);border-color:var(--leaf);box-shadow:0 0 0 3px rgba(63,174,73,.18)}
.item .it{font-weight:700;font-size:14px;min-width:0}
.item .it small{display:inline-block;margin-left:6px;font-size:11px;font-weight:900;color:#fff;background:var(--ai);border-radius:99px;padding:0 7px;vertical-align:middle}
.iboxes{display:grid;grid-template-columns:38px 38px;gap:4px}
.ibox{position:relative;width:38px;height:38px;border:2px dashed #cfd8e6;border-radius:10px;display:grid;place-items:center;cursor:pointer;background:var(--foam)}
.ibox input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.ibox img{height:30px;width:auto;opacity:.3;filter:grayscale(1);transition:.2s}
.ibox:has(input:checked){border:2px solid var(--leaf);background:#e8f8e8}
.ibox:has(input:checked) img{opacity:1;filter:none;transform:scale(1.05)}
.ibox:has(input:disabled){cursor:default}
.idel{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;min-width:26px;height:26px;padding:0 6px;font-weight:900;font-size:14px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 0 var(--ink)}
.item.confirm{background:#fff2f0;border-color:var(--shu)}
.item.confirm .idel{background:var(--shu);color:#fff;border-color:var(--ink);font-size:12px;padding:0 10px;animation:pop .25s}
.iadd{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:8px}
.iadd input,.iadd select{border:2px solid var(--ink);border-radius:10px;padding:6px 8px;font:inherit;background:#fff;min-width:0}
/* ============ 手紙 ============ */
.letters{margin-top:16px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:0 4px 0 var(--ink)}
.letters h3{font-size:17px}
.letter-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
@media (max-width:560px){.letter-grid{grid-template-columns:1fr}}
.letter{background:var(--sand);border:2px solid var(--ink);border-radius:16px;padding:10px;min-width:0}
.letter .env{width:72px;display:block;margin:0 auto 4px}
.lt-h{font-weight:900;text-align:center;font-size:13px;margin-bottom:6px}
.letter textarea{width:100%;min-height:120px;border:2px solid var(--ink);border-radius:10px;padding:8px;font:inherit;resize:vertical;background:#fff;margin-bottom:6px}
.lt-body{white-space:pre-wrap;background:#fff;border-radius:10px;padding:10px;line-height:1.9;overflow-wrap:anywhere;animation:enter .6s ease}
.letter .sealed{min-height:80px;text-align:center;color:var(--muted);font-weight:700;display:grid;place-items:center}
/* ============ グルメ図鑑 ============ */
.bar.green i{background:repeating-linear-gradient(45deg,var(--leaf) 0 10px,#7ccb45 10px 20px)}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;margin-top:12px}
.food{background:#fff;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 4px 0 var(--ink);display:grid;grid-template-rows:auto 1fr}
.food.got{border-color:var(--leaf)}
.food-pic{position:relative;aspect-ratio:4/3;border:0;background:var(--foam);padding:0;overflow:hidden;display:grid;place-items:center;width:100%}
.food-pic img{width:100%;height:100%;object-fit:cover;display:block}
.food-pic svg{width:70%;opacity:.8}
.food-pic:not(:disabled){cursor:pointer}
.get-hint{position:absolute;right:6px;bottom:6px;background:var(--sea);color:#fff;font-size:11px;font-weight:900;border-radius:99px;padding:1px 8px}
.got-badge{position:absolute;left:-4px;top:8px;background:var(--shu);color:#fff;font-family:var(--pop);font-size:12px;padding:1px 10px 1px 12px;border-radius:0 99px 99px 0;transform:rotate(-6deg);box-shadow:0 2px 0 var(--ink)}
.food-in{padding:8px 10px 10px}
.food-n{font-weight:900;font-size:14px;line-height:1.3}
.food-d{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5;font-weight:700}
.food-w{font-size:12px;font-weight:900;color:var(--sea-deep);margin-top:4px}
.food.got .food-w{color:var(--leaf)}
/* ============ いいね・称号 ============ */
.lb-bot .like{display:inline-flex;align-items:center;gap:6px}
.lb-bot .like svg{width:22px;height:22px}
.lb-bot .like.on{background:rgba(255,92,147,.3)}
.grid .tag.green{background:var(--leaf)}
.grid .heart{position:absolute;right:4px;top:2px;color:var(--hibiscus);font-size:16px;text-shadow:0 0 3px #fff}
.result .subtitles{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
.result .subtitles span{background:rgba(255,255,255,.15);border:2px solid var(--sun);border-radius:99px;padding:0 10px;font-size:12px}

/* ============ 誕生日 ============ */
.cake{width:22px;height:22px;vertical-align:middle}.cake.s{width:18px;height:18px}.cake.r{transform:scaleX(-1)}
.bday{display:flex;align-items:center;gap:10px;margin:8px 0 2px;background:linear-gradient(90deg,#fff0f5,#fff8d6);border:2px solid var(--hibiscus);border-radius:14px;padding:8px 12px;
  background-image:radial-gradient(circle at 12% 30%,rgba(255,92,147,.25) 2px,transparent 3px),radial-gradient(circle at 88% 70%,rgba(255,210,63,.5) 2px,transparent 3px),radial-gradient(circle at 60% 20%,rgba(19,181,200,.3) 2px,transparent 3px),linear-gradient(90deg,#fff0f5,#fff8d6)}
.bday .cake{width:30px;height:30px;flex:0 0 auto}
.bday b{font-family:var(--pop);font-weight:400;color:var(--hibiscus);font-size:15px;display:block}
.bday span{font-size:12.5px;color:var(--ink);font-weight:700}
.daytabs button.bday-tab::before{content:"";position:absolute;left:-5px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--hibiscus);border:2px solid #fff}
.daytabs button{position:relative}
.bubble.count .cake{margin-right:2px}

/* ============ ログイン ============ */
.modal .box.login{max-width:420px}
.login .whopick button[aria-pressed="true"]{background:var(--sun);transform:translateY(-3px);box-shadow:0 7px 0 var(--ink)}
.login-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
.login-form input{border:3px solid var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:16px;min-width:0;background:#fff}
.foot{text-align:center;padding:10px 0 20px}
.foot .linkbtn{color:#fff;opacity:.8;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.pw-form{display:grid;gap:8px;margin-top:12px}
.pw-form input{border:3px solid var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:16px;background:#fff}
.pw-btns{display:flex;gap:8px;justify-content:center}
/* ============ 画面の地（砂浜のボード） ============ */
.board-wrap{background:var(--sand) url("sandtex.webp") 0 0/256px 256px;border:4px solid var(--ink);border-radius:28px;padding:18px clamp(12px,3.5vw,22px) 22px;margin-top:-18px;position:relative;z-index:4;box-shadow:0 6px 0 var(--ink),0 18px 40px rgba(0,30,60,.35)}
.board-wrap::before{content:"";position:absolute;inset:0;border-radius:24px;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(180,140,80,.25);pointer-events:none}
section.view{position:relative}
.head{display:flex;align-items:center;gap:10px;margin:2px 0 12px;flex-wrap:wrap}
.head .tag{background:var(--c,var(--shu));color:#fff;font-family:var(--pop);font-size:clamp(18px,5vw,23px);padding:4px 18px 6px;border-radius:14px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transform:rotate(-1.5deg)}
.head .aside{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700}

/* 吹き出し付きのMiiコメント */
.say{display:flex;gap:8px;align-items:flex-end;margin:10px 0}
.say img{width:46px;flex:0 0 auto}
.say .b{background:#fff;border:3px solid var(--ink);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:13px;font-weight:700;min-width:0;white-space:pre-line}

/* ============ 島めぐりマップ ============ */
.mapbox{display:grid;grid-template-columns:minmax(0,350px) 1fr;gap:16px;align-items:start}
@media (max-width:760px){.mapbox{grid-template-columns:1fr}}
.map-col{min-width:0}
@media (min-width:761px){.map-col{position:sticky;top:12px}}
.map{background:#17a2c4;border:3px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 5px 0 var(--ink);position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.map.touchmode{touch-action:none;box-shadow:0 5px 0 var(--ink),0 0 0 4px var(--sun) inset}
.map{-webkit-touch-callout:none}
.map-ctrl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.map-ctrl button{min-width:36px;height:36px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;font-family:var(--pop);font-size:16px;box-shadow:0 3px 0 var(--ink);padding:0 8px;color:var(--ink)}
.map-ctrl button.wide{font-size:12px}
.map-ctrl button.on{background:var(--sun)}
.ed-place{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ed-place .pl{font-size:12px;font-weight:900;color:var(--shu)}
.ed-place .pl.ok{color:#2e7d32}
.ed-place .pl.ok::before{content:"● ";}
.st-badge.off{background:#fff;color:var(--shu);border:2px solid var(--shu)}
.modal .box.picker{text-align:left;max-width:560px;background:#fff;max-height:calc(100vh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
.pk-search{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:6px}
.pk-search input,.pk-paste-in input{width:100%;border:2px solid var(--ink);border-radius:10px;padding:7px 9px;font:inherit;font-size:14px;min-width:0}
.pk-results{display:grid;gap:6px;margin:4px 0}
.pk-hit{text-align:left;border:2px solid var(--ink);background:var(--sand);border-radius:12px;padding:6px 10px;font:inherit;display:grid;gap:1px}
.pk-hit b{font-size:14px}.pk-hit small{font-size:11.5px;color:var(--muted);font-weight:700}
.pk-hit.on{background:var(--sun)}
.pk-paste{margin:6px 0}
.pk-paste summary{font-size:12.5px;font-weight:900;cursor:pointer}
.pk-paste-in{display:grid;grid-template-columns:1fr auto;gap:6px;margin:6px 0 4px}
.pk-map{touch-action:none}
.pk-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap;position:sticky;bottom:0;background:#fff;padding:8px 0 4px}
.pk-btns{display:flex;gap:6px;margin-left:auto}
.map>svg{width:100%;height:auto;display:block}
.okimap{--k:1}
.okimap text{font-family:var(--body);font-weight:900;fill:var(--ink)}
.okimap .ttl{font-family:var(--pop);font-size:34px;fill:#fff;opacity:.95;letter-spacing:.08em}
.okimap .ttl2{font-size:17px;fill:#fff;opacity:.9;letter-spacing:.12em}
.okimap .rg{font-size:calc(21px*var(--k));fill:#2b4a2b;opacity:.9;paint-order:stroke;stroke:rgba(255,255,255,.8);stroke-width:calc(5px*var(--k));stroke-linejoin:round;text-anchor:middle;letter-spacing:.05em;pointer-events:none}
.okimap .r58{fill:none;stroke:rgba(255,255,255,.75);stroke-linejoin:round;stroke-linecap:round}
.okimap .expy-bg{fill:none;stroke:#fff;stroke-linejoin:round;stroke-linecap:round;opacity:.95}
.okimap .expy{fill:none;stroke:#f5a524;stroke-linejoin:round;stroke-linecap:round}
.okimap .lm{pointer-events:none}
.okimap .route{fill:none;stroke-linecap:round;stroke-linejoin:round;animation:march 1.4s linear infinite;filter:drop-shadow(0 0 2px rgba(255,255,255,.9))}
@keyframes march{to{stroke-dashoffset:-20}}
.okimap .pin{cursor:pointer;outline:none}
.okimap .pin.other{opacity:.7}
.okimap .pin.other:hover{opacity:1}
.okimap .pin .no{font-size:calc(17px*var(--k));fill:#fff;text-anchor:middle;pointer-events:none;font-family:var(--pop)}
.okimap .pin.focus .no{font-size:calc(21px*var(--k))}
.okimap .pin .lb{font-size:calc(24px*var(--k));paint-order:stroke;stroke:#fff;stroke-width:calc(7px*var(--k));stroke-linejoin:round;pointer-events:none}
.okimap .pin.focus .lb{font-size:calc(27px*var(--k));fill:#b3231a}
.okimap .pin:focus-visible circle{stroke:var(--sun)}
.okimap .me-ring{fill:rgba(255,210,63,.35);stroke:#ffd23f;stroke-width:3;animation:mering 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes mering{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.5);opacity:0}}
.okimap .me .lb{font-size:22px;fill:#8a5a00}
.okimap .scale text{font-size:calc(16px*var(--k));fill:#fff;paint-order:stroke;stroke:#0e7f9b;stroke-width:calc(3px*var(--k))}
.okimap .compass text{font-family:var(--pop);font-size:20px;fill:#fff;text-anchor:middle}
.okimap .inset{cursor:pointer;overflow:visible;filter:drop-shadow(0 3px 0 rgba(35,49,79,.5))}
.map-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.map-btns{display:inline-flex;gap:6px;flex-wrap:wrap}
.stops li[data-stop]{cursor:pointer}
.drive-total{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;font-weight:900;color:var(--ink);background:var(--sand);border-radius:12px;padding:6px 10px;margin:4px 0 8px}
.drive-total svg{width:20px;height:20px;flex:none}
.drive-total .muted{font-weight:700;font-size:11.5px}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:900;color:var(--muted)}
.legend i{width:14px;height:14px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--ink);display:inline-block;flex:none}
.map-hint{margin-top:6px}
.map-focus{--c:var(--sea);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:8px;background:#fff;border:3px solid var(--ink);border-left:10px solid var(--c);border-radius:14px;padding:8px 10px;box-shadow:0 4px 0 var(--ink);animation:pop .25s ease-out}
.map-focus .fno{font-family:var(--pop);font-size:12px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:999px;padding:2px 8px;white-space:nowrap}
.map-focus .ft{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.map-focus .ft b{font-size:14.5px;overflow-wrap:anywhere}
.map-focus .ft span{font-size:12px;color:var(--muted);font-weight:700}
.stops li.drive{padding:0 0 2px}
.stops li.drive .t{visibility:hidden}
.stops li.drive div{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:var(--muted);background:var(--sand);border-radius:999px;padding:2px 10px 2px 6px;width:max-content;max-width:100%}
.stops li.drive svg{width:18px;height:18px;flex:none}
.stops li.focus>div{background:#fff8dc;border-radius:12px;padding:4px 8px;margin:-4px -8px;box-shadow:inset 0 0 0 2px var(--sun)}
.daytabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.daytabs button{--c:var(--sea);border:3px solid var(--ink);background:#fff;border-radius:12px;padding:2px 10px;line-height:1.3;font-weight:900;text-align:center;box-shadow:0 3px 0 var(--ink)}
.daytabs button small{display:block;font-size:10.5px;font-weight:900;letter-spacing:.04em;opacity:.85}
.daytabs button[aria-pressed="true"]{background:var(--c);color:#fff}
.daycard{background:var(--card);border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.daycard .ribbon{background:var(--c);color:#fff;padding:10px 14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.daycard .ribbon .no{font-family:var(--pop);font-size:13px;background:#fff;color:var(--c);border-radius:999px;padding:0 10px;line-height:1.7}
.daycard .ribbon h3{font-size:19px}
.daycard .inner{padding:4px 14px 14px}
.stops{list-style:none;margin:0;padding:0;position:relative}
.stops::before{content:"";position:absolute;left:27px;top:18px;bottom:18px;border-left:3px dotted var(--sand-deep)}
.stops li{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:10px 0;position:relative}
.stops .t{font-size:12.5px;font-weight:900;background:#fff;border:2px solid var(--ink);border-radius:10px;text-align:center;height:max-content;position:relative;z-index:1;font-variant-numeric:tabular-nums;padding:1px 2px;overflow-wrap:anywhere;line-height:1.4}
.stops .n{font-weight:900}
.stops .pno{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:50%;color:#fff;font-family:var(--pop);font-size:11px;margin-right:5px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--ink);vertical-align:2px}
.stops .d{font-size:13px;color:var(--muted);font-weight:700}
.stops a{font-size:12px}
.infobox{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:8px 12px;font-size:13px;display:grid;gap:6px}
.infobox .row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.infobox .k{font-weight:900}
.infobox .v{min-width:0;flex:1}
.linkbtn{border:0;background:none;color:var(--sea-deep);font-weight:900;font-size:12px;padding:0;text-decoration:underline}
.edit-row{display:flex;gap:6px;width:100%}
.edit-row input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:10px;padding:6px 8px;font:inherit;background:#fff;color:var(--ink)}

/* ============ ガチャ ============ */
.gacha{margin-top:18px;background:linear-gradient(160deg,#ff8a5c,var(--shu));border:3px solid var(--ink);border-radius:22px;padding:14px;box-shadow:0 5px 0 var(--ink);color:#fff;position:relative;overflow:hidden}
.gacha h3{font-size:19px;text-shadow:2px 2px 0 rgba(0,0,0,.2)}
.gacha-stage{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0}
.machine{width:78px;flex:0 0 auto}
.machine .globe{transform-box:fill-box;transform-origin:50% 50%}
.machine.shake .globe{animation:shake .7s ease}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
.mission-list{display:grid;gap:8px}
.mission{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;display:flex;gap:10px;align-items:center;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.mission .cap{width:26px;height:26px;border-radius:50%;flex:0 0 auto;border:2px solid var(--ink);background:linear-gradient(var(--c,var(--sun)) 50%,#fff 50%)}
.mission .txt{flex:1;min-width:0;font-weight:700}
.mission.done .txt{text-decoration:line-through;text-decoration-color:var(--shu);text-decoration-thickness:2px;opacity:.7}
.mission .ok{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:2px 10px;font-weight:900;font-size:12px;flex:0 0 auto}
.mission.done .ok{background:var(--sun)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.gacha .hint{font-size:12px;opacity:.9;margin-top:8px}

/* ============ スタンプ ============ */
.prog-row{display:flex;align-items:center;gap:10px}
.prog-row .num{font-family:var(--pop);font-size:17px;white-space:nowrap}
.bar{flex:1;height:16px;border:3px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--shu) 0 10px,#ff7a6b 10px 20px);transition:width .8s}
.spots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.spot{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px;position:relative;overflow:hidden;display:grid;gap:6px;align-content:start;box-shadow:0 4px 0 var(--ink)}
.spot .top{display:flex;gap:6px;align-items:center}
.spot .day{font-size:11px;font-weight:900;color:#fff;background:var(--c);border-radius:999px;padding:0 9px;line-height:1.7}
.spot .nm{font-weight:900;font-size:15px;line-height:1.35}
.spot:has(.stampmark) .nm{padding-right:80px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{aspect-ratio:1;border:3px dashed #cfd8e6;border-radius:14px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);overflow:hidden;position:relative;background:var(--foam);padding:0;max-width:100%}
.slot img.ph{width:100%;height:100%;object-fit:cover}
.slot img.face{height:72%;width:auto;opacity:.32}
.slot .who{position:absolute;left:5px;top:5px;background:var(--ink);color:#fff;font-size:10px;font-weight:900;border-radius:99px;padding:0 7px;z-index:1}
.slot.mine{border-color:var(--sea);color:var(--sea-deep);font-weight:900;cursor:pointer;background:#e3fafb}
.slot.mine span.plus{font-family:var(--pop);font-size:26px;line-height:1}
.stampmark{position:absolute;right:4px;top:2px;width:86px;height:86px;pointer-events:none;transform:rotate(-14deg);opacity:.92}
.stampmark.new{animation:thump .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes thump{0%{transform:rotate(-14deg) scale(2.6);opacity:0}60%{opacity:1}100%{transform:rotate(-14deg) scale(1)}}
.treasure{margin-top:16px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;box-shadow:0 4px 0 var(--ink)}
.treasure svg{width:64px}
.treasure textarea{width:100%;min-height:90px;border:2px solid var(--ink);border-radius:10px;padding:8px;font:inherit;margin-top:6px}
.treasure .msg{white-space:pre-wrap;font-weight:700}

/* ============ 日記 ============ */
.diary{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.diary{grid-template-columns:1fr}}
.page{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 14px;min-width:0;box-shadow:0 4px 0 var(--ink);
  background-image:repeating-linear-gradient(transparent 0 31px,#d8eef0 31px 32px);background-position:0 54px}
.page.yui{border-top:10px solid var(--hibiscus)}.page.sai{border-top:10px solid var(--sea)}
.page h3{font-size:15px;display:flex;align-items:center;gap:8px}
.page h3 img{height:40px;width:auto}
.page textarea{width:100%;min-height:160px;border:0;background:transparent;font:inherit;line-height:32px;color:var(--ink);resize:vertical;padding:0;margin-top:4px}
.page .body{white-space:pre-wrap;line-height:32px;margin-top:4px;overflow-wrap:anywhere}
.sealed{display:grid;place-items:center;text-align:center;min-height:170px;color:var(--muted);font-weight:700}
.sealed svg{width:58px;margin:0 auto 4px;display:block}
.banner{margin-bottom:12px;background:var(--ai);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:900;display:flex;align-items:center;gap:8px}
.moon{width:22px;height:22px;border-radius:50%;box-shadow:inset -6px -2px 0 0 var(--sun);flex:0 0 auto}
.remind{margin-top:16px;background:var(--ai);color:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:0 4px 0 var(--ink);
  background-image:radial-gradient(circle at 15% 30%,#fff 1px,transparent 2px),radial-gradient(circle at 70% 20%,#fff 1px,transparent 2px),radial-gradient(circle at 85% 70%,#fff 1.5px,transparent 2.5px),radial-gradient(circle at 40% 80%,#fff 1px,transparent 2px)}
.remind h3{font-size:17px;display:flex;align-items:center;gap:8px}

/* ============ アルバム ============ */
.uploadbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 2px}
.prog{font-size:13px;font-weight:900;color:var(--sea-deep)}
.album-day{margin-top:16px;content-visibility:auto;contain-intrinsic-size:auto 300px}
.album-day h3{font-size:16px;display:flex;align-items:center;gap:8px}
.album-day h3 .dot{width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-top:8px}
.grid button{padding:0;border:3px solid #fff;aspect-ratio:1;background:var(--foam);overflow:hidden;border-radius:10px;position:relative;max-width:100%;box-shadow:0 2px 0 rgba(35,49,79,.25)}
.grid button:nth-child(3n){transform:rotate(1.2deg)}.grid button:nth-child(3n+1){transform:rotate(-1deg)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .tag{position:absolute;left:4px;bottom:4px;background:var(--shu);color:#fff;font-size:10px;border-radius:99px;padding:0 6px;font-weight:900}
.empty{background:#fff;border:3px dashed var(--sand-deep);border-radius:18px;padding:20px;text-align:center;color:var(--muted);margin-top:12px;font-weight:700}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(6,30,40,.95);display:grid;grid-template-rows:auto 1fr auto;color:#fff;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.lb-top,.lb-bot{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:10px}
.lb-top button,.lb-bot button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:99px;padding:6px 16px;font-weight:900}
.lb-stage{overflow:auto;display:grid;place-items:center;touch-action:pan-x pan-y pinch-zoom}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.lb-stage.zoom img{max-width:none;max-height:none}

/* ============ リザルト ============ */
.result{background:linear-gradient(180deg,#1d3a8a,var(--ai));color:#fff;border:3px solid var(--ink);border-radius:24px;padding:18px;box-shadow:0 5px 0 var(--ink);position:relative;overflow:hidden;font-weight:900}
.result .rays{position:absolute;left:50%;top:120px;width:640px;height:640px;margin:-320px 0 0 -320px;background:repeating-conic-gradient(rgba(255,255,255,.08) 0 10deg,transparent 10deg 20deg);animation:spin 40s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.result h3{font-family:var(--pop);font-size:26px;color:var(--sun);text-align:center;position:relative;text-shadow:3px 3px 0 var(--shu)}
.result .pair{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-top:8px;position:relative}
.result .pair img{height:150px;width:auto}
.result .rows{display:grid;gap:8px;margin-top:10px;position:relative;background:rgba(0,0,0,.18);border-radius:16px;padding:10px 14px}
.result .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px dashed rgba(255,255,255,.3);padding-bottom:4px}
.result .r:last-child{border-bottom:0}
.result .r b{font-family:var(--pop);font-size:28px;font-weight:400;color:var(--sun);font-variant-numeric:tabular-nums}
.result .rank{margin-top:14px;text-align:center;position:relative}
.result .rank strong{display:inline-block;font-family:var(--pop);font-weight:400;font-size:clamp(20px,6vw,26px);color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:14px;padding:4px 16px;margin-top:6px;box-shadow:0 4px 0 var(--ink)}
.locked{filter:grayscale(.6);opacity:.75}
.dayres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.dayres .c{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-size:13.5px;font-weight:700;box-shadow:0 3px 0 var(--ink);border-top:10px solid var(--c)}
.dayres .c h4{margin:0 0 4px;font-family:var(--pop);font-weight:400;font-size:14px;color:var(--c)}

/* ============ モーダル等 ============ */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,60,80,.55);display:grid;place-items:center;padding:20px;overflow:auto}
.modal.top{z-index:65}
/* ============ 思い出ムービー ============ */
.movie{position:fixed;inset:0;z-index:80;background:#071a26;color:#fff;overflow:hidden;font-family:var(--body)}
.movie .sh-stage{position:absolute;inset:0}
.movie .sl{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .7s ease}
.movie .sl.in{opacity:1}.show .sl.out{opacity:0}
.movie .sl.photo .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(26px) brightness(.55);transform:scale(1.1)}
.movie .sl.photo img.main{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .5s}
.movie .sl.photo img.main.ready{opacity:1;animation:kb var(--dur,4s) ease-in-out forwards}
@keyframes kb{from{transform:scale(1.02) translate(var(--x0,0),var(--y0,0))}to{transform:scale(1.12) translate(var(--x1,0),var(--y1,0))}}
.movie .cap{position:absolute;left:0;right:0;bottom:calc(118px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:900;font-size:16px;text-shadow:0 2px 6px rgba(0,0,0,.8);padding:0 16px}
.movie .cap small{display:block;font-size:12px;opacity:.85;font-weight:700}
.movie .sl.title{background:linear-gradient(160deg,#13b5c8,#2f4fb5);text-align:center;padding:24px}
.movie .sl.title .no{font-family:var(--pop);font-size:clamp(22px,8vw,40px);color:#ffd23f;letter-spacing:.06em}
.movie .sl.title .dt{font-size:16px;font-weight:900;opacity:.9;margin-top:4px}
.movie .sl.title h2{font-family:var(--pop);font-size:clamp(26px,9vw,52px);margin:10px 0 4px;line-height:1.2}
.movie .sl.title .th{font-size:15px;font-weight:900;opacity:.9}
.movie .sl.title .cake{width:64px;height:64px;margin-top:10px}
.movie .sl.title .miis{position:static;display:flex;justify-content:center;gap:10px;margin-top:18px}
.movie .sl.title .miis img{height:150px;width:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.movie .sl.intro{background:linear-gradient(180deg,#13b5c8 0%,#0a7f9c 60%,#fbe7b5 60%,#fbe7b5 100%)}
.movie .sl.intro .logo{position:relative;left:auto;top:auto;transform:none;width:min(78%,360px);margin:0 auto 10px;animation:none}
.movie .sl.intro .introcap{margin-top:16px;color:var(--ink);text-align:center;font-weight:900;font-size:16px}
.movie .sl.intro .introcap small{display:block;font-size:12px;opacity:.8}
.movie .sl.diary{background:linear-gradient(160deg,#ff5c93,#8a5cf6);padding:20px}
.movie .sl.diary .pages{display:grid;gap:12px;width:min(92%,640px)}
.movie .sl.diary .pg{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;font-weight:700;font-size:15px;line-height:1.6;white-space:pre-wrap;max-height:36vh;overflow:auto}
.movie .sl.diary .pg h4{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-family:var(--pop);font-size:14px;color:var(--hibiscus)}
.movie .sl.diary .pg h4 img{height:34px;width:auto}
.movie .sl.ending{background:linear-gradient(180deg,#1d3a8a,#2f4fb5);text-align:center;padding:24px 24px 120px;overflow:auto}
@media (max-height:720px){.movie .sl.ending .miis img{height:90px!important}.movie .sl.ending .rows{gap:4px}.movie .sl.title .miis img{height:110px}}
.movie .sl.ending h2{font-family:var(--pop);font-size:clamp(24px,8vw,44px);color:#ffd23f;margin:0 0 8px}
.movie .sl.ending .rows{display:grid;gap:6px;width:min(88%,420px);margin:12px auto}
.movie .sl.ending .rows div{display:flex;justify-content:space-between;background:rgba(255,255,255,.12);border-radius:12px;padding:6px 12px;font-weight:900}
.movie .sl.ending .rows b{font-family:var(--pixel);font-size:20px;color:#ffd23f}
.movie .sl.ending .rank{font-family:var(--pop);font-size:clamp(18px,6vw,30px);background:#ffd23f;color:var(--ink);border-radius:999px;padding:6px 18px;display:inline-block;margin-top:6px}
.movie .sl.ending .fin{margin-top:18px;font-family:var(--pop);letter-spacing:.3em;opacity:.8}
.movie .sh-top{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:2;gap:8px}
.movie .sh-top select,.movie .sh-bot select{border:2px solid #fff;background:rgba(0,0,0,.4);color:#fff;border-radius:999px;padding:4px 10px;font:inherit;font-weight:900;font-size:12.5px}
.movie .sh-top button,.movie .sh-bot button{border:2px solid #fff;background:rgba(0,0,0,.4);color:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-weight:900;font-size:13px;min-height:36px}
.movie .sh-bot{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;z-index:2}
.movie .sh-bot .cnt{font-family:var(--pixel);font-size:13px;opacity:.85;min-width:60px;text-align:center}
.movie .sh-bot button.big{width:48px;height:48px;padding:0;font-size:18px;display:grid;place-items:center}
.movie .sh-bot button.on{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.movie .sh-hint{position:absolute;left:0;right:0;top:calc(52px + env(safe-area-inset-top,0px));text-align:center;font-size:12px;opacity:.8;z-index:2;font-weight:700}
.movie.hide-ui .sh-top,.movie.hide-ui .sh-bot,.movie.hide-ui .sh-hint{opacity:0;pointer-events:none;transition:opacity .4s}
.movie-box{margin-top:14px;background:linear-gradient(135deg,#ff5c93,#8a5cf6);color:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 5px 0 var(--ink)}
.movie-box>div{flex:1 1 220px}
.movie-box h3{font-size:17px;margin:0 0 2px}
.movie-box .btn{margin-left:auto}
.sysbar{margin:0 0 12px;background:#fff3c4;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:900;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 4px 0 var(--ink)}
.sysbar .btn{margin-left:auto}
.modal .box.diag{max-width:520px;text-align:left;background:#fff;max-height:calc(100vh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
.diag-list{list-style:none;margin:10px 0;padding:0;display:grid;gap:6px}
.diag-list li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;background:var(--sand);border-radius:12px;padding:8px 10px;font-size:13.5px;font-weight:900}
.diag-list li i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;font-style:normal;font-family:var(--pop);font-size:13px}
.diag-list li.ok i{background:#8fd654}.diag-list li.ng i{background:var(--shu);color:#fff}.diag-list li.wait i{background:#fff}.diag-list li.warn i{background:var(--sun)}
.diag-list li small{display:block;font-weight:700;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.diag-fix{background:#eafaff;border:3px solid var(--sea);border-radius:14px;padding:10px 12px;font-size:13px;margin:8px 0}
.diag-fix ol{margin:6px 0 0;padding-left:20px}
.diag-fix code{background:#fff;border-radius:6px;padding:0 4px;font-size:12px}
.modal .box{background:var(--sand);border:4px solid var(--ink);border-radius:24px;padding:20px;max-width:440px;width:100%;text-align:center;box-shadow:0 6px 0 var(--ink)}
.modal h2{font-size:22px}
.whopick{display:flex;justify-content:center;gap:14px;margin-top:14px;flex-wrap:wrap}

function haversine(a,b){const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

function moonSVG(age,r=11){
  const th=2*Math.PI*age/29.53,k=(1-Math.cos(th))/2,rx=Math.max(.01,r*Math.abs(2*k-1)),waxing=age<14.77,sweep=k>.5?1:0;
  const path=`M0,${-r} A${r},${r} 0 0,1 0,${r} A${rx},${r} 0 0,${sweep} 0,${-r} Z`;
  return `<svg class="moon-svg" viewBox="${-r-2} ${-r-2} ${2*r+4} ${2*r+4}" aria-hidden="true"><circle r="${r}" fill="#2b3a66"/><path d="${path}" fill="#fff6c8" transform="scale(${waxing?1:-1},1)"/><circle r="${r}" fill="none" stroke="#23314f" stroke-width="1.5"/></svg>`;
}

let actx=null;const SND={on:ls.get("snd")!=="off"};
function beep(kind){
  if(!SND.on)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state!=="running")actx.resume().catch(()=>{});
    const t=actx.currentTime,g=actx.createGain();g.connect(actx.destination);g.gain.value=.0001;
    const notes={tap:[[660,.06]],stamp:[[523,.08],[659,.08],[784,.14]],gacha:[[392,.05],[494,.05],[587,.05],[784,.12]],clear:[[784,.07],[1046,.16]],open:[[523,.06],[659,.06],[784,.06],[1046,.2]]}[kind]||[[660,.06]];
    let at=t;for(const [f,d] of notes){const o=actx.createOscillator();o.type="triangle";o.frequency.value=f;o.connect(g);o.start(at);o.stop(at+d);g.gain.setValueAtTime(.12,at);g.gain.exponentialRampToValueAtTime(.0001,at+d);at+=d}
  }catch{}
}

/* ---------- 波の音（合成の環境音） ---------- */
const WAVE={on:false,nodes:null};
function wavesStart(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state!=="running")actx.resume().catch(()=>{});
    const sr=actx.sampleRate,len=sr*6,buf=actx.createBuffer(2,len,sr);
    for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5}}
    const src=actx.createBufferSource();src.buffer=buf;src.loop=true;
    const lp=actx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=520;lp.Q.value=.7;
    const hp=actx.createBiquadFilter();hp.type="highpass";hp.frequency.value=60;
    const g=actx.createGain();g.gain.value=0;
    const lfo=actx.createOscillator();lfo.type="sine";lfo.frequency.value=.085;const lg=actx.createGain();lg.gain.value=.11;
    const lfo2=actx.createOscillator();lfo2.type="sine";lfo2.frequency.value=.031;const lg2=actx.createGain();lg2.gain.value=.05;
    const base=actx.createConstantSource();base.offset.value=.16;
    lfo.connect(lg).connect(g.gain);lfo2.connect(lg2).connect(g.gain);base.connect(g.gain);
    src.connect(hp).connect(lp).connect(g).connect(actx.destination);
    src.start();lfo.start();lfo2.start();base.start();
    WAVE.nodes={src,lfo,lfo2,base,g,lg,lg2};WAVE.on=true;
  }catch(e){console.warn(e);toast("この端末では波の音を再生できませんでした")}
}
function wavesStop(){if(!WAVE.nodes)return;const {src,lfo,lfo2,base,lg,lg2}=WAVE.nodes;try{const t0=actx.currentTime;for(const prm of [base.offset,lg.gain,lg2.gain]){prm.cancelScheduledValues(t0);prm.setTargetAtTime(0,t0,.3)}setTimeout(()=>{try{src.stop();lfo.stop();lfo2.stop();base.stop()}catch{}},1200)}catch{}WAVE.nodes=null;WAVE.on=false}
// 電話や画面ロックのあと、音が止まったままにならないように

function errInfo(e,where){
  const m=String(e?.message||e?.error_description||e?.error||e||"");const code=String(e?.code||e?.statusCode||e?.status||"");
  if(e?.code==="not_ready")return {kind:"busy",msg:e.message,fix:null};
  const net=(e instanceof TypeError&&/fetch|Load failed|network/i.test(m))||/Failed to fetch|NetworkError|Load failed|network|timeout|ECONN/i.test(m)||e?.status===0;
  if(net)return {kind:"network",msg:"電波がとどいていないみたい。少し待ってもう一度試してね",fix:"net"};
  if(/does not exist|42P01|42883|PGRST205|PGRST202|schema cache/i.test(m+code))return {kind:"setup",msg:/docs/i.test(m)?"保存先の表（docs）がまだ作られていません":"保存先の設定（表や関数）がまだ作られていません",fix:"sql"};

/* ---------- 島ニュース（できごと） ---------- */
function newsItems(){
  const ev=[];const spotName=id=>SPOTS().find(s=>s.id===id)?.n||"どこか";
  const albumRuns=[];
  for(const p of S.photos){
    if(p.spot){ev.push({at:p.at,t:`${NAME[p.who]}が「${spotName(p.spot)}」でとうちゃく写真をあげた`,k:"stamp"});continue}
    if(p.food){ev.push({at:p.at,t:`${NAME[p.who]}が図鑑の「${FOODBY[p.food]?.n||"？"}」をゲット！`,k:"food"});continue}
    const last=albumRuns[albumRuns.length-1];
    if(last&&last.who===p.who&&p.at-last.at<15*60e3){last.n++;last.at=p.at}else albumRuns.push({who:p.who,at:p.at,n:1});
  }
  for(const r of albumRuns)ev.push({at:r.at,t:`${NAME[r.who]}がアルバムに写真を${r.n}枚追加した`,k:"album"});
  for(const s of SPOTS()){const p=spotPhotos(s.id);if(p.sai&&p.yui)ev.push({at:Math.max(p.sai.at,p.yui.at),t:`「${s.n}」のスタンプがそろった！`,k:"done"})}
  for(const [k,m] of Object.entries(S.missions)){const n=+k.replace("day","");for(const x of m.draws||[]){if(x.done&&x.doneAt)ev.push({at:x.doneAt,t:`${NAME[x.by]||"ふたり"}がDAY${n}のミッション「${mtext(MBYID[x.id],DAYS()[n-1]).slice(0,18)}…」をクリア`,k:"mission"})}}
  for(const [k,d] of Object.entries(S.diary)){const m=k.match(/^d(\d)_(sai|yui)$/);if(m&&d.at)ev.push({at:d.at,t:`${NAME[m[2]]}がDAY${m[1]}の日記を書いた`,k:"diary"})}
  for(const [w,l] of Object.entries(S.letters)){if(l?.at)ev.push({at:l.at,t:`${NAME[w]}が最終日にひらく手紙を書いた`,k:"letter"})}
  if(S.plan?.updatedAt)ev.push({at:S.plan.updatedAt,t:`${NAME[S.plan.by]||"だれか"}がしおりを更新した`,k:"plan"});
  return ev.sort((a,b)=>b.at-a.at).slice(0,6);
}
function newsHTML(){
  const ev=newsItems();
  return `<div class="news"><div class="news-h"><span class="news-tag">島ニュース</span></div>${ev.length?`<ul>${ev.map(e=>`<li class="k-${e.k}"><span class="when">${relTime(e.at)}</span>${esc(e.t)}</li>`).join("")}</ul>`:`<div class="small muted">まだニュースはありません。写真や日記で、島がにぎやかになっていくよ。</div>`}</div>`;
}

async function geocode(q){
  try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&accept-language=ja&viewbox=126.6,27.2,128.6,25.9&bounded=1&q="+encodeURIComponent(q),{signal:AbortSignal.timeout?AbortSignal.timeout(8000):undefined});
