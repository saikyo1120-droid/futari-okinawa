/* ---------- レイヤー描画 ---------- */
function show(names) { for (const [k, g] of Object.entries(L)) g.visible = names.includes(k); }
window.renderLayer = (name) => {
  if (name === 'back') show(['back', 'water', 'sky']);
  else if (name === 'foam') show(['foam']);
  else if (name === 'front') show(['front']);
  else if (name === 'water') { show(['water']); }
  else if (name === 'all') show(['back', 'water', 'sky', 'foam', 'front']);
  // 影を落とす側は常に全体（前景の木の影が砂に落ちるように）
  const HIDE = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });
  if (name === 'back') { L.front.visible = true; L.front.traverse(o => { if (o.isMesh) { o._m = o.material; o.material = HIDE; } }); }
  if (name === 'water') { L.water.traverse(o => { if (o.isMesh) { o._m = o.material; o.material = new THREE.MeshBasicMaterial({ color: 0xffffff }); } }); }
  renderer.render(scene, camera);
  if (name === 'back') { L.front.traverse(o => { if (o.isMesh && o._m) { o.material = o._m; o._m = null; } }); }
  if (name === 'water') { L.water.traverse(o => { if (o.isMesh && o._m) { o.material = o._m; } }); }
  return renderer.domElement.toDataURL('image/png');
};
