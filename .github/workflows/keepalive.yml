    steps:
      - name: ping
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" "${SUPABASE_URL}/rest/v1/docs?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}"
